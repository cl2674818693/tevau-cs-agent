# 模板：复制为 secret.yaml 并填实际值后 apply（secret.yaml 已经在 .gitignore，不会被提交）
# 注意所有 value 都用明文字符串，K8S 会自动 base64 编码（stringData）
apiVersion: v1
kind: Secret
metadata:
  name: cs-engine-secrets
  namespace: tevau-cs-engine-dev
type: Opaque
stringData:
  # LLM API Key
  ANTHROPIC_API_KEY: "sk-ant-xxx"

  # 自有库 MySQL（DBA 在公司 MySQL RDS 上新建的 ai_engine 库 + 读写账号）
  DB_URL: "mysql+aiomysql://<user>:<pwd>@<host>:3306/ai_engine"

  # 业务库（阿里云 RDS tevau_test_read 只读账号）
  UNLIMITPAY_DB_URL: "mysql+aiomysql://tevau_test_read:<pwd>@rm-gs5bk11j43yl6jxt4.mysql.singapore.rds.aliyuncs.com:3306/unlimitpay_test"
  NEXUS_DB_URL: "mysql+aiomysql://tevau_test_read:<pwd>@rm-gs5bk11j43yl6jxt4.mysql.singapore.rds.aliyuncs.com:3306/tevau_nexus"

  # 限流 Redis（公司开发环境 Redis 内网地址）
  REDIS_URL: "redis://<host>:6379/0"

  # 事项中心出站/入站 token（向事项中心同事要）
  EVENT_CENTER_TOKEN: ""
  EVENT_CENTER_CALLBACK_TOKEN: ""

  # 客服 JWT / B 端 session 签名密钥；本地各跑一次 openssl rand -hex 32
  STAFF_JWT_SECRET: ""
  BU_SESSION_SECRET: ""

  # /metrics 抓取鉴权（可选；建议先填一个随机 token，让 Prometheus 端配同样的 Bearer）
  METRICS_AUTH_TOKEN: ""

  # 对象存储凭据（连集群内 MinIO 用默认 minioadmin；连 OSS 用 OSS 凭据）
  OBJECT_STORE_ACCESS_KEY: "minioadmin"
  OBJECT_STORE_SECRET_KEY: "minioadmin"

  # Lark webhook（开发环境可留空，留空则差评/工单兜底告警不发）
  LARK_WEBHOOK_URL: ""
