# 阿里云 Prometheus（或自建）抓取配置示例
# 把这段加到阿里云 Prometheus 控制台的「服务发现 / 自定义抓取」，
# 或自建 Prometheus 的 prometheus.yml -> scrape_configs。
# 告警规则见 grafana/alerts.rules.yml；面板见 grafana/tevau-ai-engine.dashboard.json。
- job_name: "tevau-ai-engine"
  metrics_path: "/metrics"
  scrape_interval: 15s
  static_configs:
    - targets: ["ai-engine.tevau.internal:8000"]
      labels:
        env: "prod"
        service: "tevau-ai-engine"
