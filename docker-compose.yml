services:
  api:
    build: ./server
    ports: ["8000:8000"]
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - ANTHROPIC_BASE_URL=${ANTHROPIC_BASE_URL:-}
      - DB_URL=sqlite+aiosqlite:////data/ai_engine.db
      - SOURCEGRAPH_URL=http://sourcegraph:7080
      - SOURCEGRAPH_TOKEN=${SOURCEGRAPH_TOKEN}
      - OPENAPI_DOC_PATH=/repos/api-docs/openapi.json
      - PROMPTS_DIR=/app/src/ai_engine/prompts
      - EVENT_CENTER_URL=${EVENT_CENTER_URL:-http://api:8000/_mock/event-center}
      # HMAC 双 key 热轮换（spec §7.4）：先灌 CURRENT，轮换时把旧值移到 PREVIOUS
      - EVENT_CENTER_SECRET_CURRENT=${EVENT_CENTER_SECRET_CURRENT:-mvp1-shared-secret}
      - EVENT_CENTER_SECRET_PREVIOUS=${EVENT_CENTER_SECRET_PREVIOUS:-}
      # 生产保持 false（不挂 /_mock/event-center）；本地联调置 true
      - MOCK_EVENT_CENTER=${MOCK_EVENT_CENTER:-false}
      - LARK_WEBHOOK_URL=${LARK_WEBHOOK_URL:-}
      - STAFF_JWT_SECRET=${STAFF_JWT_SECRET}
      # C 端 APP JWT 验签公钥（RS256，仅验签）；上线必填
      - APP_JWT_PUBLIC_KEY=${APP_JWT_PUBLIC_KEY:-}
      # 成本治理：单 BU/单 user 单日 token 硬阈值
      - DAILY_TOKEN_LIMIT=${DAILY_TOKEN_LIMIT:-500000}
      # 本地 dev 连同 compose 的 mysql；生产改为阿里云 RDS 只读账号
      - UNLIMITPAY_DB_URL=${UNLIMITPAY_DB_URL:-mysql://tevau_test_read:${MYSQL_PASSWORD}@mysql:3306/unlimitpay_test}
      - NEXUS_DB_URL=${NEXUS_DB_URL:-}
    labels:
      # 供 sidecar/服务发现抓取 /metrics（spec §11 可观测性，端点始终开启）
      - "prometheus.scrape=true"
      - "prometheus.port=8000"
      - "prometheus.path=/metrics"
    volumes:
      - ./data:/data
      - ./repos:/repos:ro
    depends_on:
      - sourcegraph
      - mysql

  sourcegraph:
    image: sourcegraph/server:5.3.0
    ports: ["7080:7080"]
    volumes:
      - sg-config:/etc/sourcegraph
      - sg-data:/var/opt/sourcegraph
    restart: unless-stopped

  # 本地开发用 MySQL；生产用阿里云 RDS 只读账号（见 docs/resources.md）
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: unlimitpay_test
      MYSQL_USER: tevau_test_read
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-readpass}
    ports: ["3306:3306"]
    volumes:
      - mysql-data:/var/lib/mysql
      - ./server/tests/fixtures/unlimitpay_seed.sql:/docker-entrypoint-initdb.d/01-seed.sql:ro
    restart: unless-stopped

  web:
    image: node:20-alpine
    working_dir: /web
    volumes: ["./web:/web"]
    command: sh -c "corepack enable && CI=true pnpm install && pnpm dev --host 0.0.0.0"
    ports: ["5173:5173"]
    depends_on: [api]

volumes:
  sg-config:
  sg-data:
  mysql-data:
