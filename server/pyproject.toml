[project]
name = "ai-engine"
version = "0.1.0"
description = "Tevau 客服工单 AI 引擎"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "anthropic>=0.40",
  "pydantic>=2.8",
  "pydantic-settings>=2.4",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "aiosqlite>=0.20",
  "python-multipart>=0.0.9",
  "pyjwt[crypto]>=2.9",
  "aiomysql>=0.2.0",
  "prometheus-client>=0.20",
  "pyyaml>=6.0",
  "redis>=5",
  "alembic>=1.13",
  "asyncpg>=0.31.0",
  "greenlet>=3.5.1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5",
  "ruff>=0.6.8",
  "mypy>=1.11",
  "respx>=0.21",
  "pre-commit>=3.7",
  "testcontainers[mysql]>=4.7.0",
  "pymysql>=1.1",
  "fakeredis[lua]>=2.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"

[tool.ruff]
line-length = 100
target-version = "py312"
# alembic 自动生成的迁移文件不纳入 lint/format（生成代码，格式由 alembic 模板决定）
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = [
    "E", "F", "W",       # pyflakes + pycodestyle
    "I",                  # isort
    "B",                  # bugbear（常见 bug）
    "UP",                 # pyupgrade
    "ASYNC",              # async 错误
    "S",                  # bandit 安全规则
    "RUF",                # ruff 自有
    "C90",                # mccabe 复杂度
]
ignore = [
    "S101",   # 测试里 assert 没问题
    "S105",   # 测试 fake 密码
    "S106",   # 测试 fake 密码（kwarg）
    "RUF001", # 中文项目: 字符串里的全角标点是正常的
    "RUF002", # 中文项目: docstring 里的全角标点是正常的
    "RUF003", # 中文项目: 注释里的全角标点是正常的
]
mccabe = { max-complexity = 10 }

[tool.ruff.lint.flake8-bugbear]
# FastAPI 依赖注入惯用法：Depends/Query/Header 作为参数默认值不算 B008
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105", "S106", "S107"]
"scripts/*" = ["S603", "S607"]   # 脚本里允许 subprocess

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
files = ["src"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false   # 测试允许略松

[tool.coverage.run]
source = ["src/ai_engine"]
omit = ["*/tests/*", "*/__main__.py"]
branch = true

[tool.coverage.report]
fail_under = 75       # MVP-1 至少 75%，逐 MVP 提高（MVP-2: 80%, MVP-3: 85%）
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
